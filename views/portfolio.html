    <section class="page-head container">
      <p class="eyebrow">{{t.portfolio.eyebrow}}</p>
      <h1>{{t.portfolio.title}}</h1>
      <p class="lead">{{t.portfolio.lead}}</p>
    </section>

    <section class="section container">
      <div class="chips" id="project-filters" role="group" aria-label="{{t.portfolio.filters}}">
        <button class="chip-btn active" type="button" data-kind="" aria-pressed="true">{{t.portfolio.all}}</button>
        <button class="chip-btn" type="button" data-kind="website" aria-pressed="false">{{t.portfolio.website}}</button>
        <button class="chip-btn" type="button" data-kind="business" aria-pressed="false">{{t.portfolio.business}}</button>
        <button class="chip-btn" type="button" data-kind="landing" aria-pressed="false">{{t.portfolio.landing}}</button>
        <button class="chip-btn" type="button" data-kind="portfolio" aria-pressed="false">{{t.portfolio.portfolio}}</button>
      </div>
      <p class="result-count" id="result-count" role="status" aria-live="polite"></p>
      <div class="cards" id="project-grid"><div class="placeholder">{{t.client.loading}}</div></div>
      <noscript><p class="notice">{{t.portfolio.noscript}}</p></noscript>
    </section>
