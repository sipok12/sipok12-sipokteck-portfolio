    <section class="page-head container">
      <p class="eyebrow">{{t.services.eyebrow}}</p>
      <h1>{{t.services.title}}</h1>
      <p class="lead">{{t.services.lead}}</p>
    </section>

    <section class="section container">
      <div class="cards cards-wide" id="services-list" aria-live="polite"><div class="placeholder">{{t.client.loading}}</div></div>
      <noscript><p class="notice">{{t.services.noscript}}</p></noscript>
    </section>

    <section class="section container">
      <div class="cta-band">
        <div><h2>{{t.services.ctaTitle}}</h2><p>{{t.services.ctaText}}</p></div>
        <div class="actions"><a class="button button-primary" href="{{p:contact}}?service=autre#devis">{{t.services.ctaButton}}</a><a class="button button-ghost" href="{{p:pricing}}">{{t.services.ctaPricing}}</a></div>
      </div>
    </section>
